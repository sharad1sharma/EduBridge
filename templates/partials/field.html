<div class="field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="opt">(optional)</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="hint" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
  {% for error in field.errors %}<p class="err">{{ error }}</p>{% endfor %}
</div>
